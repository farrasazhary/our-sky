# Nginx Configuration for OurSky (oursky.farrasazhary.my.id)

# 1. HTTP Server - Redirect to HTTPS
server {
    listen 80;
    server_name oursky.farrasazhary.my.id;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server
server {
    listen 443 ssl http2;
    server_name oursky.farrasazhary.my.id;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/oursky.farrasazhary.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oursky.farrasazhary.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client Max Body Size for Photo Uploads (10MB)
    client_max_body_size 10M;

    # Root Directory for Built React Frontend (PWA)
    root /var/www/our-sky/client/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend React Router & SPA Fallback (Fresh index.html)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static JS/CSS Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker & PWA Manifest Cache Control
    location /sw.js {
        add_header Cache-Control "no-cache";
        proxy_cache_bypass $http_pragma;
        proxy_cache_revalidate on;
        expires off;
        access_log off;
    }

    location /manifest.webmanifest {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        expires off;
    }

    # Static Media Storage (Uploaded Memory & Profile Photos)
    location /uploads/ {
        alias /var/www/our-sky/server/storage/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Backend Express REST API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
